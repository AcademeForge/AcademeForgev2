*/
</style>

<script>
/*
================================================================================
████████████████████████████████████████████████████████████████████████████████
                    👉 START OF SECTION: AF FINAL SUPPORT PATCH JS 👈
████████████████████████████████████████████████████████████████████████████████
================================================================================
*/

(function () {
  "use strict";

  const AF_EDGE = {
    bug: "https://afooyyydhlwngzssgqih.supabase.co/functions/v1/report-bug",
    requestStatus: "https://afooyyydhlwngzssgqih.supabase.co/functions/v1/request-status-af",
    contactSubmit: "https://afooyyydhlwngzssgqih.supabase.co/functions/v1/contact-request",
    contactStatus: "https://afooyyydhlwngzssgqih.supabase.co/functions/v1/contact-request-status-af"
  };

  function $(id) {
    return document.getElementById(id);
  }

  function qsa(selector, root) {
    return Array.from((root || document).querySelectorAll(selector));
  }

  function valueOf(id) {
    const node = $(id);
    return String(node && node.value ? node.value : "").trim();
  }

  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (char) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char];
    });
  }

  function isEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/i.test(String(value || "").trim());
  }

  function getAnonKey() {
    return typeof window.SUPABASE_ANON_KEY !== "undefined" && window.SUPABASE_ANON_KEY
      ? window.SUPABASE_ANON_KEY
      : "";
  }

  function getHeaders() {
    const key = getAnonKey();

    const headers = {
      "Content-Type": "application/json"
    };

    if (key) {
      headers.apikey = key;
      headers.Authorization = "Bearer " + key;
    }

    return headers;
  }

  function safeJsonParse(raw) {
    try {
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      return parsed && typeof parsed === "object" ? parsed : null;
    } catch (error) {
      return null;
    }
  }

  function getStoredStudent() {
    const keys = [
      "af_current_student",
      "af_logged_student",
      "af_student_session",
      "af_student_data",
      "studentaf_session",
      "student_session_af",
      "currentStudentaf",
      "current_student_af",
      "currentStudent",
      "studentData",
      "loggedInStudent",
      "student"
    ];

    for (let i = 0; i < keys.length; i += 1) {
      const parsed = safeJsonParse(localStorage.getItem(keys[i]));

      if (parsed) {
        const student = parsed.student || parsed.data || parsed.user || parsed.profile || parsed;

        if (student && typeof student === "object") {
          return student;
        }
      }
    }

    return {};
  }

  function getIdentity() {
    const student = getStoredStudent();

    const email = String(
      student.registered_email ||
        student.email ||
        student.student_email ||
        student.email_id ||
        student.studentEmail ||
        student.user_email ||
        localStorage.getItem("af_student_email") ||
        localStorage.getItem("student_email_af") ||
        localStorage.getItem("studentEmailaf") ||
        localStorage.getItem("studentEmail") ||
        localStorage.getItem("registered_email") ||
        localStorage.getItem("email") ||
        ""
    ).trim().toLowerCase();

    const mobile = String(
      student.registered_mobile ||
        student.mobile_number ||
        student.mobile ||
        student.phone ||
        student.phone_number ||
        student.student_mobile ||
        localStorage.getItem("af_student_mobile") ||
        localStorage.getItem("student_mobile_af") ||
        localStorage.getItem("studentPhoneaf") ||
        localStorage.getItem("studentPhone") ||
        localStorage.getItem("registered_mobile") ||
        localStorage.getItem("mobile") ||
        localStorage.getItem("phone") ||
        ""
    ).trim();

    const name = String(
      student.full_name ||
        student.name ||
        student.student_name ||
        localStorage.getItem("af_student_name") ||
        localStorage.getItem("student_name_af") ||
        localStorage.getItem("studentNameaf") ||
        ""
    ).trim();

    return {
      email: email,
      mobile: mobile,
      name: name
    };
  }

  function formatDate(value) {
    try {
      if (!value) return "Recently submitted";

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "Recently submitted";

      return date.toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    } catch (error) {
      return "Recently submitted";
    }
  }

  function flagTrue(value) {
    return String(value || "F").trim().toUpperCase() === "T" || value === true;
  }

  function setMessage(id, type, message) {
    const box = $(id);
    if (!box) return;

    box.classList.remove("is-error", "is-empty", "is-success");
    box.textContent = message || "";
    box.style.display = message ? "block" : "none";

    if (type === "error") box.classList.add("is-error");
    if (type === "empty") box.classList.add("is-empty");
    if (type === "success") box.classList.add("is-success");
  }

  function ensureContactStatusButton() {
    const settingsSupportList = document.querySelector(".settings-support-list");
    if (!settingsSupportList) return;

    if (document.querySelector('[onclick="openContactStatusPageAf()"]')) return;

    const button = document.createElement("button");
    button.type = "button";
    button.className = "settings-support-row";
    button.setAttribute("aria-label", "Open Contact Us Status");
    button.setAttribute("onclick", "openContactStatusPageAf()");
    button.innerHTML = [
      '<div class="settings-support-left">',
      '<span class="settings-support-icon" aria-hidden="true">✓</span>',
      "<span>Contact Us Status</span>",
      "</div>",
      '<span class="settings-new-badge">Track</span>'
    ].join("");

    const divider = settingsSupportList.querySelector(".settings-support-divider");
    if (divider) {
      settingsSupportList.insertBefore(button, divider);
    } else {
      settingsSupportList.appendChild(button);
    }
  }

  function ensureContactStatusSection() {
    if ($("contactStatusAf")) return;

    const section = document.createElement("section");
    section.id = "contactStatusAf";
    section.className = "section contact-status-section-af";
    section.setAttribute("aria-label", "Contact Status");

    section.innerHTML = [
      '<div class="contact-status-page-af">',
      '<div class="contact-status-hero-af">',
      '<button type="button" class="contact-status-back-af" onclick="showSection(\'settings\')" aria-label="Back to settings">← Back</button>',
      '<div class="contact-status-hero-text-af">',
      "<p>Support Center</p>",
      "<h2>Contact Status</h2>",
      "<span>Track your contact requests and team replies.</span>",
      "</div>",
      '<button type="button" class="contact-status-refresh-af" onclick="loadContactStatusAf(true)" aria-label="Refresh contact status">↻</button>',
      "</div>",
      '<div id="contactStatusMessageAf" class="contact-status-message-af">Loading your contact requests...</div>',
      '<div id="contactStatusListAf" class="contact-status-list-af"></div>',
      "</div>"
    ].join("");

    const app = document.querySelector(".app") || document.querySelector("main") || document.body;
    const bottomNav = document.querySelector(".bottom-nav");

    if (bottomNav && bottomNav.parentNode) {
      bottomNav.parentNode.insertBefore(section, bottomNav);
    } else {
      app.appendChild(section);
    }
  }

  function ensureBugOverlayClickSafety() {
    const overlay = $("bugReportOverlay");
    if (!overlay) return;

    overlay.addEventListener("click", function (event) {
      if (event.target === overlay) {
        window.closeBugReportModal();
      }
    });

    const modal = overlay.querySelector(".bug-report-modal");
    if (modal) {
      modal.addEventListener("click", function (event) {
        event.stopPropagation();
      });
    }
  }

  function ensureContactSheetClickSafety() {
    const section = $("contactUsAf");
    if (!section) return;

    section.addEventListener("click", function (event) {
      if (event.target === section) {
        window.closeContactUsSheetAf();
      }
    });

    const page = section.querySelector(".contact-us-af-page");
    if (page) {
      page.addEventListener("click", function (event) {
        event.stopPropagation();
      });
    }
  }

  function fixedShowSection(id) {
    const targetId = String(id || "").trim();
    const target = $(targetId);

    if (!target) {
      console.error("Section not found:", targetId);
      return;
    }

    if (targetId !== "contactUsAf") {
      const contact = $("contactUsAf");
      if (contact) {
        contact.classList.remove("active", "active-section");
        contact.setAttribute("aria-hidden", "true");
      }
    }

    qsa(".section, .app-section").forEach(function (section) {
      if (section.id === "contactUsAf") return;

      section.classList.remove("active", "active-section");
      section.setAttribute("aria-hidden", "true");
    });

    target.classList.add("active");
    target.classList.remove("hidden-box");
    target.setAttribute("aria-hidden", "false");

    qsa(".bottom-nav .nav-btn").forEach(function (button) {
      const active = button.dataset.section === targetId;
      button.classList.toggle("active", active);

      if (active) {
        button.setAttribute("aria-current", "page");
      } else {
        button.removeAttribute("aria-current");
      }
    });

    if (targetId === "requestStatusAf") {
      window.setTimeout(function () {
        window.loadRequestStatusAf(false);
      }, 80);
    }

    if (targetId === "contactStatusAf") {
      window.setTimeout(function () {
        window.loadContactStatusAf(false);
      }, 80);
    }

    if (targetId === "learningHeatmap" && typeof window.loadLearningHeatmap === "function") {
      window.loadLearningHeatmap();
    }

    if (targetId !== "contactUsAf") {
      window.scrollTo({ top: 0, left: 0, behavior: "auto" });
    }
  }

  window.showSection = fixedShowSection;

  window.openBugReportModal = function () {
    try {
      const overlay = $("bugReportOverlay");
      const form = $("bugReportForm");
      const status = $("bugReportStatus");
      const pageUrl = $("bugPageUrl");
      const userAgent = $("bugUserAgent");

      if (!overlay) {
        console.error("bugReportOverlay not found");
        return;
      }

      if (form) form.reset();

      if (status) {
        status.textContent = "";
        status.className = "bug-report-status";
        status.style.display = "none";
      }

      if (pageUrl) pageUrl.value = window.location.href;
      if (userAgent) userAgent.value = navigator.userAgent || "";

      overlay.classList.add("show");
      overlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("bug-report-open");

      window.setTimeout(function () {
        const firstInput = $("bugReporterName");
        if (firstInput) firstInput.focus();
      }, 120);
    } catch (error) {
      console.error("openBugReportModal failed:", error);
    }
  };

  window.closeBugReportModal = function () {
    try {
      const overlay = $("bugReportOverlay");

      if (overlay) {
        overlay.classList.remove("show");
        overlay.setAttribute("aria-hidden", "true");
      }

      document.body.classList.remove("bug-report-open");
    } catch (error) {
      console.error("closeBugReportModal failed:", error);
    }
  };

  function setBugReportStatus(message, type) {
    const status = $("bugReportStatus");
    if (!status) return;

    status.textContent = String(message || "");
    status.className = "bug-report-status";

    if (type === "success") status.classList.add("success");
    if (type === "error") status.classList.add("error");

    status.style.display = message ? "block" : "none";
  }

  window.submitBugReport = async function (event) {
    if (event) event.preventDefault();

    const submitBtn = $("bugReportSubmitBtn");

    try {
      const reporterName = valueOf("bugReporterName");
      const reporterEmail = valueOf("bugReporterEmail").toLowerCase();
      const category = valueOf("bugCategory");
      const priority = valueOf("bugPriority");
      const description = valueOf("bugDescription");
      const stepsToReproduce = valueOf("bugSteps");
      const pageUrl = valueOf("bugPageUrl") || window.location.href;

      if (reporterName.length < 2) {
        setBugReportStatus("Please enter a valid name.", "error");
        return;
      }

      if (!isEmail(reporterEmail)) {
        setBugReportStatus("Please enter a valid email address.", "error");
        return;
      }

      if (!category) {
        setBugReportStatus("Please select a bug category.", "error");
        return;
      }

      if (!priority) {
        setBugReportStatus("Please select a valid priority.", "error");
        return;
      }

      if (description.length < 10) {
        setBugReportStatus("Please describe the bug in at least 10 characters.", "error");
        return;
      }

      const identity = getIdentity();

      const payload = {
        reporterName: reporterName,
        reporterEmail: reporterEmail,
        registered_email: reporterEmail || identity.email,
        email: reporterEmail || identity.email,
        mobile: identity.mobile,
        category: category,
        priority: priority,
        description: description,
        stepsToReproduce: stepsToReproduce,
        pageUrl: pageUrl,
        activeSection: document.querySelector(".section.active, .app-section.active")?.id || "",
        deviceInfo: {
          userAgent: navigator.userAgent || "",
          language: navigator.language || "",
          platform: navigator.platform || "",
          viewportWidth: window.innerWidth || 0,
          viewportHeight: window.innerHeight || 0,
          devicePixelRatio: window.devicePixelRatio || 1,
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "",
          online: navigator.onLine === true
        }
      };

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting...";
      }

      setBugReportStatus("Submitting your report...", "");

      const response = await fetch(AF_EDGE.bug, {
        method: "POST",
        headers: getHeaders(),
        body: JSON.stringify(payload)
      });

      const result = await response.json().catch(function () {
        return null;
      });

      if (!response.ok || (result && result.success === false)) {
        throw new Error(
          result && (result.message || result.error)
            ? result.message || result.error
            : "Bug report failed. Please try again."
        );
      }

      try {
        localStorage.setItem("af_student_email", reporterEmail);
      } catch (storageError) {}

      const form = $("bugReportForm");
      if (form) form.reset();

      setBugReportStatus("Bug report submitted successfully.", "success");

      window.setTimeout(function () {
        window.closeBugReportModal();
      }, 900);
    } catch (error) {
      console.error("submitBugReport failed:", error);
      setBugReportStatus(error && error.message ? error.message : "Something went wrong.", "error");
    } finally {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Report";
      }
    }
  };

  window.openContactUsPage = function () {
    const section = $("contactUsAf");

    if (!section) {
      console.error("contactUsAf section not found");

  window.closeContactUsSheetAf = function () {
    const section = $("contactUsAf");

    if (section) {
      section.classList.remove("active", "active-section");
      section.setAttribute("aria-hidden", "true");

    document.body.classList.remove("contact-us-open");

    box.className = "contact-message-af";

    if (type === "error") box.classList.add("is-error");

    box.textContent = message || "";

  function getDeviceId() {
    let id = localStorage.getItem("af_device_id");

    if (!id) {
      id = "web_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2);
      localStorage.setItem("af_device_id", id);
    }

    return id;
  }

  window.submitContactRequestAf = async function (event) {
    if (event) event.preventDefault();

    const submitBtn = $("contactSubmitBtnAf");

    try {
      setContactMessage("", "");

      const identity = getIdentity();
      const mobile = valueOf("contactMobileAf").replace(/\s+/g, "");
      const email = valueOf("contactEmailAf").toLowerCase();

      const payload = {
        student_id: null,
        student_identifier: identity.email || identity.mobile || email || mobile || null,
        student_name: identity.name || valueOf("contactNameAf") || null,
        full_name: valueOf("contactNameAf"),
        mobile_number: mobile,
        email: email,
        registered_email: email,
        contact_reason: valueOf("contactReasonAf"),
        problem_description: valueOf("contactProblemAf"),
        page_url: window.location.href,
        user_agent: navigator.userAgent || "",
        device_id: getDeviceId()
      };

      if (payload.full_name.length < 2) {
        setContactMessage("error", "Please enter your full name.");
        return;
      }

      if (!/^(\+91)?[6-9]\d{9}$/.test(mobile) && !/^\+\d{8,15}$/.test(mobile)) {
        setContactMessage("error", "Please enter a valid mobile number.");
        return;
      }

      if (!isEmail(email)) {
        setContactMessage("error", "Please enter a valid email address.");
        return;
      }

      if (!payload.contact_reason) {
        setContactMessage("error", "Please select why you want to contact our team.");
        return;
      }

      if (payload.problem_description.length < 10) {
        setContactMessage("error", "Please describe your issue properly.");
        return;
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting...";
      }

      const response = await fetch(AF_EDGE.contactSubmit, {
        method: "POST",
        headers: getHeaders(),
        body: JSON.stringify(payload)
      });

      const result = await response.json().catch(function () {
        return null;
      });

      if (!response.ok || !result || result.success !== true) {
        throw new Error(
          result && result.message
            ? result.message
            : "Unable to submit request right now."
        );
      }

      try {
        localStorage.setItem("af_student_email", email);
        localStorage.setItem("af_student_mobile", mobile);
        localStorage.setItem("af_student_name", payload.full_name);
      } catch (storageError) {}

      const form = $("contactUsFormAf");
      if (form) form.reset();

      setContactMessage("success", "Your request has been submitted successfully. Our team will contact you soon.");
    } catch (error) {
      console.error("submitContactRequestAf failed:", error);
      setContactMessage("error", error && error.message ? error.message : "Something went wrong. Please try again.");
    } finally {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Request";
      }
    }
  };

  window.openRequestStatusPageAf = function () {
    window.showSection("requestStatusAf");
  };

  function getBugStatus(report) {
    const isRead = flagTrue(report.team_read);
    const isSolved = flagTrue(report.request_solved);

    if (isSolved) {
      return {
        label: "Solved",
        className: "solved"
      };
    }

    if (isRead) {
      return {
        label: "In Review",
        className: "read"
      };
    }

    return {
      label: "Pending",
      className: "pending"
    };
  }

  function getReportTitle(report) {
    return (
      report.category ||
      report.issue_type ||
      report.bug_type ||
      report.subject ||
      report.title ||
      "Bug Report"
    );
  }

  function getReportText(report) {
    return (
      report.description ||
      report.details ||
      report.message ||
      report.bug_description ||
      report.report_text ||
      report.additional_details ||
      "No detailed message found for this report."
    );
  }

  window.toggleRequestCardAf = function (cardId) {
    const card = $(cardId);
    if (card) card.classList.toggle("is-expanded");
  };

  function renderBugReportCard(report, index) {
    const isRead = flagTrue(report.team_read);
    const isSolved = flagTrue(report.request_solved);
    const status = getBugStatus(report);
    const cardId = "requestCardAf_" + index + "_" + String(report.id || Date.now()).replace(/[^a-zA-Z0-9_-]/g, "");

    const title = escapeHtml(getReportTitle(report));
    const fullText = escapeHtml(getReportText(report));
    const createdAt = escapeHtml(formatDate(report.created_at));
    const note = escapeHtml(report.status_note || report.admin_note || "");

    return [
      '<article id="' + cardId + '" class="request-card-af" style="animation-delay:' + index * 70 + 'ms" onclick="toggleRequestCardAf(\'' + cardId + '\')">',
      '<div class="request-card-top-af">',
      '<div class="request-card-icon-af">✓</div>',
      '<div class="request-card-title-af">',
      "<h3>" + title + "</h3>",
      "<p>Submitted: " + createdAt + "</p>",
      "</div>",
      '<span class="request-status-pill-af ' + status.className + '">' + status.label + "</span>",
      "</div>",
      '<div class="request-progress-af">',
      '<div class="request-step-af is-done">',
      '<div class="request-step-dot-af">✓</div>',
      '<div class="request-step-content-af"><strong>Report Sent</strong><span>Your report has been submitted successfully.</span></div>',
      "</div>",
      '<div class="request-step-af ' + (isRead ? "is-done" : "is-pending") + '">',
      '<div class="request-step-dot-af">' + (isRead ? "✓" : "!") + "</div>",
      '<div class="request-step-content-af"><strong>Team Read Your Report</strong><span>' + (isRead ? "Team has read your report." : "Pending — team has not read it yet.") + "</span></div>",
      "</div>",
      '<div class="request-step-af ' + (isSolved ? "is-done" : "is-pending") + '">',
      '<div class="request-step-dot-af">' + (isSolved ? "✓" : "!") + "</div>",
      '<div class="request-step-content-af"><strong>Solved Your Request</strong><span>' + (isSolved ? "Your request has been solved." : "Pending — solution is not marked yet.") + "</span></div>",
      "</div>",
      "</div>",
      '<div class="request-card-detail-af">',
      "<strong>Your Report</strong>",
      "<p>" + fullText + "</p>",
      note ? '<div class="request-note-af">' + note + "</div>" : "",
      "</div>",
      "</article>"
    ].join("");
  }

  window.loadRequestStatusAf = async function (forceRefresh) {
    const list = $("requestStatusListAf");

    try {
      if (list) list.innerHTML = "";

      setMessage(
        "requestStatusMessageAf",
        "",
        forceRefresh ? "Refreshing request status..." : "Loading your requests..."
      );

      const identity = getIdentity();
      const registeredEmail = identity.email;

      if (!registeredEmail) {
        setMessage("requestStatusMessageAf", "error", "Login first to view your request status.");
        return;
      }

      const response = await fetch(AF_EDGE.requestStatus, {
        method: "POST",
        headers: getHeaders(),
        body: JSON.stringify({
          registered_email: registeredEmail
        })
      });

      const result = await response.json().catch(function () {
        return null;
      });

      if (!response.ok || !result || result.success !== true) {
        throw new Error(
          result && result.message
            ? result.message
            : "Unable to load request status right now."
        );
      }

      const reports = Array.isArray(result.reports) ? result.reports : [];

      if (!reports.length) {
        setMessage("requestStatusMessageAf", "empty", "No request found. Your bug reports will appear here after submission.");
        return;
      }

      setMessage("requestStatusMessageAf", "", "");

      if (list) {
        list.innerHTML = reports
          .map(function (report, index) {
            return renderBugReportCard(report, index);
          })
          .join("");
      }
    } catch (error) {
      console.error("loadRequestStatusAf failed:", error);
      setMessage(
        "requestStatusMessageAf",
        "error",
        error && error.message ? error.message : "Something went wrong. Please try again."
      );
    }
  };

  window.openContactStatusPageAf = function () {
    ensureContactStatusSection();
    window.showSection("contactStatusAf");
  };

  function getContactStatus(request) {
    const rawStatus = String(request.status || "").trim().toLowerCase();

    if (
      rawStatus === "solved" ||
      rawStatus === "resolved" ||
      flagTrue(request.request_solved)
    ) {
      return {
        label: "Solved",
        className: "solved"
      };
    }

    if (
      rawStatus === "in_review" ||
      rawStatus === "in review" ||
      rawStatus === "review" ||
      flagTrue(request.team_read)
    ) {
      return {
        label: "In Review",
        className: "read"
      };
    }

    return {
      label: "Pending",
      className: "pending"
    };
  }

  function getContactTitle(request) {
    return (
      request.contact_reason ||
      request.reason ||
      request.subject ||
      request.category ||
      request.issue_type ||
      "Contact Request"
    );
  }

  function getContactText(request) {
    return (
      request.problem_description ||
      request.message ||
      request.details ||
      request.description ||
      request.additional_details ||
      request.problem ||
      "No detailed message found for this contact request."
    );
  }

  window.toggleContactCardAf = function (cardId) {
    const card = $(cardId);
    if (card) card.classList.toggle("is-expanded");
  };

  function renderContactCard(request, index) {
    const status = getContactStatus(request);
    const cardId = "contactCardAf_" + index + "_" + String(request.id || Date.now()).replace(/[^a-zA-Z0-9_-]/g, "");

    const title = escapeHtml(getContactTitle(request));
    const fullText = escapeHtml(getContactText(request));
    const createdAt = escapeHtml(formatDate(request.created_at));
    const note = escapeHtml(request.status_note || request.admin_note || "");

    return [
      '<article id="' + cardId + '" class="request-card-af contact-status-card-af" style="animation-delay:' + index * 70 + 'ms" onclick="toggleContactCardAf(\'' + cardId + '\')">',
      '<div class="request-card-top-af">',
      '<div class="request-card-icon-af">✓</div>',
      '<div class="request-card-title-af">',
      "<h3>" + title + "</h3>",
      "<p>Submitted: " + createdAt + "</p>",
      "</div>",
      '<span class="request-status-pill-af ' + status.className + '">' + status.label + "</span>",
      "</div>",
      '<div class="request-card-detail-af">',
      "<strong>Your Contact Message</strong>",
      "<p>" + fullText + "</p>",
      note ? '<div class="request-note-af">' + note + "</div>" : "",
      "</div>",
      "</article>"
    ].join("");
  }

  window.loadContactStatusAf = async function (forceRefresh) {
    const list = $("contactStatusListAf");

    try {
      ensureContactStatusSection();

      if (list) list.innerHTML = "";

      setMessage(
        "contactStatusMessageAf",
        "",
        forceRefresh ? "Refreshing contact status..." : "Loading your contact requests..."
      );

      const identity = getIdentity();

      if (!identity.email && !identity.mobile) {
        setMessage("contactStatusMessageAf", "error", "Login first to view your contact request status.");
        return;
      }

      const response = await fetch(AF_EDGE.contactStatus, {
        method: "POST",
        headers: getHeaders(),
        body: JSON.stringify({
          registered_email: identity.email,
          email: identity.email,
          mobile_number: identity.mobile,
          mobile: identity.mobile,
          phone: identity.mobile
        })
      });

      const result = await response.json().catch(function () {
        return null;
      });

      if (!response.ok || !result || result.success !== true) {
        throw new Error(
          result && result.message
            ? result.message
            : "Unable to load contact request status right now."
        );
      }

      const requests = Array.isArray(result.requests)
        ? result.requests
        : Array.isArray(result.reports)
          ? result.reports
          : Array.isArray(result.data)
            ? result.data
            : [];

      if (!requests.length) {
        setMessage("contactStatusMessageAf", "empty", "No contact request found. Your contact messages will appear here after submission.");
        return;
      }

      setMessage("contactStatusMessageAf", "", "");

      const finalList = $("contactStatusListAf");

      if (finalList) {
        finalList.innerHTML = requests
          .map(function (request, index) {
            return renderContactCard(request, index);
          })
          .join("");
      }
    } catch (error) {
      console.error("loadContactStatusAf failed:", error);
      setMessage(
        "contactStatusMessageAf",
        "error",
        error && error.message ? error.message : "Something went wrong. Please try again."
      );
    }
  };

  function patchEscapeKey() {
    document.addEventListener("keydown", function (event) {
      if (event.key !== "Escape") return;

      window.closeBugReportModal();
      window.closeContactUsSheetAf();
    });
  }

  function initPatch() {
    ensureContactStatusSection();
    ensureContactStatusButton();
    ensureBugOverlayClickSafety();
    ensureContactSheetClickSafety();
    patchEscapeKey();

    const active = document.querySelector(".section.active, .app-section.active");
    if (active && active.id !== "contactUsAf") {
      window.showSection(active.id);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initPatch);
  } else {
    initPatch();
  }
})();
