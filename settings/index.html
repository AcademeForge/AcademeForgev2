  window.openRequestStatusPageAf = function () {
    window.showSection("requestStatusAf");
  };

  window.loadRequestStatusAf = async function (forceRefresh) {
    var list = $("requestStatusListAf");

    try {
      if (list) list.innerHTML = "";
      setMessage("requestStatusMessageAf", "", forceRefresh ? "Refreshing bug status..." : "Loading bug status...");

      var data = identity();

      if (!data.email) {
        setMessage("requestStatusMessageAf", "error", "Login first to view your request status.");
        return;
      }

      var response = await fetch(AF_EDGE.bugStatus, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({
          registered_email: data.email,
          email: data.email,
          mobile: data.mobile,
          mobile_number: data.mobile
        })
      });

      var result = await response.json().catch(function () {
        return null;
      });

      if (!response.ok || (result && result.success === false)) {
        throw new Error(result && (result.message || result.error) ? result.message || result.error : "Unable to load request status.");
      }

      var reports = Array.isArray(result && result.reports)
        ? result.reports
        : Array.isArray(result && result.requests)
          ? result.requests
          : Array.isArray(result && result.data)
            ? result.data
            : [];

      if (!reports.length) {
        setMessage("requestStatusMessageAf", "empty", "No bug reports found.");
        return;
      }

      setMessage("requestStatusMessageAf", "", "");

      if (list) {
        list.innerHTML = reports.map(function (report, index) {
          return renderBugCard(report, index);
        }).join("");
      }
    } catch (error) {
      setMessage("requestStatusMessageAf", "error", error && error.message ? error.message : "Could not fetch bug status.");
    }
  };

  window.openContactStatusPageAf = function () {
    ensureContactStatusSection();
    window.showSection("contactStatusAf");
  };

      var result = await response.json().catch(function () {

      });

      if (!response.ok || (result && result.success === false)) {
        throw new Error(result && (result.message || result.error) ? result.message || result.error : "Unable to load contact status.");
      }

      var requests = Array.isArray(result && result.requests)
        ? result.requests
        : Array.isArray(result && result.reports)

          : Array.isArray(result && result.data)
            ? result.data
            : [];

      if (!requests.length) {

      }

      setMessage("contactStatusMessageAf", "", "");

      if (list) {

  function patchOverlayClick() {
    var bug = $("bugReportOverlay");
    var contact = $("contactUsAf");

    if (bug && !bug.dataset.afFinalClickPatched) {
      bug.dataset.afFinalClickPatched = "1";
      bug.addEventListener("click", function (event) {
        if (event.target === bug) window.closeBugReportModal();
      });

      var bugModal = bug.querySelector(".bug-report-modal");
      if (bugModal) {
        bugModal.addEventListener("click", function (event) {
          event.stopPropagation();
        });
      }
    }

    if (contact && !contact.dataset.afFinalClickPatched) {
      contact.dataset.afFinalClickPatched = "1";
      contact.addEventListener("click", function (event) {
        if (event.target === contact) window.closeContactUsSheetAf();
      });

      var contactPage = contact.querySelector(".contact-us-af-page");
      if (contactPage) {
        contactPage.addEventListener("click", function (event) {
          event.stopPropagation();
        });
      }
    }
  }

  function init() {
    ensureContactStatusSection();
    ensureContactStatusButton();
    hydrateForms();
    patchOverlayClick();

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        window.closeBugReportModal();
        window.closeContactUsSheetAf();
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
